name: validate-skill
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository contracts
        run: python scripts/validate_repo.py
      - name: Validate behavior eval contract
        run: python scripts/run_evals.py
      - name: Runtime unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Runtime smoke demo
        env:
          PYTHONPATH: src
        run: python scripts/demo_runtime.py
