[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saasskill"
version = "1.5.0"
description = "Host-neutral runtime and MCP server for the Pet Project Launch Operator skill"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
camoufox = ["camoufox>=0.5,<1"]
google-ads = ["google-ads>=31"]
meta-ads = ["facebook-business>=26,<27"]
apple-ads = ["asa-api-client"]

[project.scripts]
saasskill = "saasskill.cli:main"
saasskill-mcp = "saasskill.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
