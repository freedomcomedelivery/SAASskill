[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saasskill"
version = "1.4.0"
description = "Host-neutral runtime and MCP server for the Pet Project Launch Operator skill"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
saasskill = "saasskill.cli:main"
saasskill-mcp = "saasskill.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
